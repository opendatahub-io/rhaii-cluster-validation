platform: EKS

agent:
  requests:
    cpu: "500m"
    memory: "512Mi"
  annotations: {}

jobs:
  # EFA (vpc.amazonaws.com/efa) is a per-device count on EKS (not a boolean like
  # CoreWeave rdma/ib). Omit from jobs.requests to auto-detect each node's full
  # allocatable count on rdma-node. Set explicitly to override.
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits: {}
  annotations: {}

gpu:
  min_driver_version: "535.0"

crds:
  min_api_versions:
    # Minimum API version required for each CRD (empty = any version)
    gateways.gateway.networking.k8s.io: ""
    httproutes.gateway.networking.k8s.io: ""
    inferencepools.inference.networking.x-k8s.io: ""
    leaderworkersets.leaderworkerset.x-k8s.io: ""
    certificates.cert-manager.io: ""
  min_release_versions:
    # Minimum release version for each CRD (empty = report only)
    gateways.gateway.networking.k8s.io: ""
    httproutes.gateway.networking.k8s.io: ""
    inferencepools.inference.networking.x-k8s.io: ""

operators:
  namespaces:
    cert-manager:
      - cert-manager
    istio:
      - istio-system
    lws:
      - openshift-lws-operator

thresholds:
  tcp_bandwidth_gbps:
    pass: 5
    warn: 1
  tcp_latency_ms:
    pass: 0.5
    warn: 1.0
  rdma_bandwidth_pd_gbps:
    pass: 180
    warn: 100
  rdma_bandwidth_wep_gbps:
    pass: 350
    warn: 200
