{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rhaii.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "rhaii.labels" . | nindent 4 }}
{{- $pullSecret := include "rhaii.pullSecretName" . }}
{{- if or $pullSecret .Values.imagePullSecrets }}
imagePullSecrets:
  {{- if $pullSecret }}
  - name: {{ $pullSecret }}
  {{- end }}
  {{- with .Values.imagePullSecrets }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
