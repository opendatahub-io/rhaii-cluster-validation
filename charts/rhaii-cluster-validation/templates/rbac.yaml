{{- if .Values.rbac.create }}
# ClusterRole for the in-cluster controller. Scoped to exactly the API
# operations the controller performs when run from a laptop under an admin
# kubeconfig (enumerated from the source), so this is deliberately NOT
# cluster-admin.
#
# Cluster-scoped verbs are required because the controller creates a namespace,
# a workload ServiceAccount, and a (deliberately empty) ClusterRole +
# ClusterRoleBinding for check Jobs, lists nodes for GPU discovery, and reads
# CustomResourceDefinitions for the deps checks.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rhaii.fullname" . }}
  labels:
    {{- include "rhaii.labels" . | nindent 4 }}
rules:
  # Namespace: created/read for the validation namespace.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  # Nodes: listed for GPU/topology discovery.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  # Pods + logs: check/job pods are created and their JSON output read from logs.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # ConfigMaps: platform config + stored report/pingmesh-failures.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete"]
  # Secrets: read the optional image-pull secret to attach to the workload SA.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # ServiceAccounts: the controller provisions the workload SA for check Jobs.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create", "update", "delete"]
  # Jobs: per-node and multi-node check Jobs.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  # ClusterRoles/Bindings: the controller creates the (empty) workload
  # ClusterRole and its binding, and deletes them on cleanup. Creating an
  # empty ClusterRole needs no "escalate" verb since it grants no permissions.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "create", "delete"]
  # bind is required to create ClusterRoleBindings, restricted to only the
  # roles this controller actually binds.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames:
      - {{ include "rhaii.fullname" . | quote }}
      - "rhaii-validator"
      {{- if .Values.openshift.enabled }}
      - "system:openshift:scc:privileged"
      {{- end }}
  # CRDs: read for the deps (CRD presence/version) checks.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rhaii.fullname" . }}
  labels:
    {{- include "rhaii.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rhaii.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "rhaii.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
